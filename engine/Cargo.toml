[package]
name = "cast-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-protocol music cast engine (DLNA/UPnP, HEOS, AirPlay 1, QPlay) for NetEase Cloud Music players"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (NetEase API + UPnP SOAP) and local HTTP gateway
ureq = { version = "3.4.2", default-features = false, features = [
    "rustls",
    "gzip",
    "charset",
] }
tiny_http_dh = "0.12.2"

# discovery
socket2 = "0.6.5"
if-addrs = "0.15"
xml = "1.4.0"

# AirPlay 1 (RAOP): ALAC payload, FLAC decode, RSA-OAEP key wrap.
# (AES-CBC is in `crypto.rs` — see the note there.)
alac-encoder = "0.3.0"
claxon = "0.4"
rsa = { version = "0.9", features = ["getrandom"] }
sha1 = "0.10"

base64 = "0.22"
htmlescape = "0.3.1"
fastrand = "2"
